<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能管理與資源治理 · 三省六部指揮中心</title>
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <aside class="sidebar" aria-label="主選單">
    <div class="sidebar-brand">
      <span class="brand-mark">唐</span>
      <span id="brand-title">三省六部指揮中心</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="footer-row">
        <span class="avatar" aria-hidden="true">A</span>
        <div>
          <div class="footer-text" id="operator-label">指揮官 · 系統管理員</div>
          <div class="footer-text">金鑰占位：<span class="mask" id="secret-mask">••••••••</span></div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div>
        <div class="header-title">
          <span id="page-title">技能管理與資源治理</span>
        </div>
        <div class="header-sub" id="page-sub">統一指揮 · 協同作戰 · 高效治理（mock · 只讀）</div>
      </div>
      <div class="header-right">
        <div id="tz-label">亞洲 / 台北</div>
        <div id="clock-label">—</div>
        <span class="header-avatar" aria-hidden="true">A</span>
      </div>
    </header>

    <div class="banner-demo" id="demo-banner">loading mock…</div>

    <div class="content p2-content">
      <div class="p2-main-grid">
        <div class="p2-left-col">
          <section class="section" aria-label="六部技能卡">
            <div class="section-title">六部技能卡</div>
            <div class="p2-skill-grid" id="p2-skill-cards"></div>
          </section>

          <section class="section" aria-label="技能模組映射">
            <div class="section-title" id="p2-map-title">技能 ↔ 執行模組 對應映射表</div>
            <div class="p2-table-wrap" id="p2-skill-map"></div>
            <div class="linkish p2-footer-link" id="p2-map-footer"></div>
          </section>
        </div>

        <aside class="p2-right-col" aria-label="資源治理">
          <div class="section-title">資源治理</div>
          <div class="p2-resource-top" id="p2-resource-top"></div>
          <div class="p2-cloud-block">
            <div class="section-title nested" id="p2-cloud-title">雲端服務分項消耗</div>
            <div id="p2-cloud-bars"></div>
          </div>
          <div class="p2-vault-block">
            <div class="section-title nested" id="p2-vault-title">金鑰庫</div>
            <div class="p2-table-wrap" id="p2-key-vault"></div>
            <div class="linkish p2-footer-link" id="p2-vault-footer"></div>
            <div class="skeleton-note" id="p2-vault-note"></div>
          </div>
        </aside>
      </div>

      <section class="section compact p2-op-section" aria-label="operator fields">
        <div class="section-title">P8.9 operator_fields（sidecar · read_only）</div>
        <div id="operator-fields"></div>
      </section>
    </div>
  </div>

  <script src="js/shell.js"></script>
  <script>
    (function () {
      CommandCenterShell.loadPageData({
        mockUrl: "mock/p2_skills_resources_v1.json",
        liveUrl: "live/p2_skills_resources_v1.json",
      })
        .then(function (data) {
          if (!data || data.ok !== true) throw new Error("page data ok!=true");
          CommandCenterShell.renderP2(data);
        })
        .catch(function (err) {
          var banner = document.getElementById("demo-banner");
          if (banner) {
            banner.textContent =
              "資料載入失敗（請以 repo 根目錄 python -m http.server 開啟；預設 mock，live 用 ?source=live）。" +
              String(err && err.message ? err.message : err);
          }
          console.error(err);
        });
    })();
  </script>
</body>
</html>
