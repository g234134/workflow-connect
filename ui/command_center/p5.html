<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多任務 Agent 協作作業台 · 三省六部指揮中心</title>
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <aside class="sidebar" aria-label="主選單">
    <div class="sidebar-brand">
      <span class="brand-mark">唐</span>
      <span id="brand-title">三省六部指揮中心</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="footer-row">
        <span class="avatar" aria-hidden="true">A</span>
        <div>
          <div class="footer-text" id="operator-label">指揮官 · 系統管理員</div>
          <div class="footer-text">金鑰占位：<span class="mask" id="secret-mask">••••••••</span></div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div>
        <div class="header-title" id="page-title">多任務 Agent 協作作業台</div>
        <div class="header-sub" id="page-sub">泳道 · 交接 · 審核 · 交付（mock）</div>
      </div>
      <div class="header-right">
        <div id="tz-label">亞洲 / 台北</div>
        <div id="clock-label">—</div>
        <span class="header-avatar" aria-hidden="true">A</span>
      </div>
    </header>

    <div class="banner-demo" id="demo-banner">loading mock…</div>

    <div class="content">
      <div class="kpi-grid kpi-grid-7" id="kpi-grid" aria-label="KPI"></div>

      <div class="p5-main-grid">
        <section class="section swimlane-section" aria-label="多任務協作泳道">
          <div class="section-title">
            多任務協作泳道
            <div class="legend" id="swim-legend"></div>
          </div>
          <div id="swimlane-board"></div>
        </section>

        <aside class="p5-side" aria-label="業務與運維摘要">
          <section class="section compact">
            <div class="section-title">商務摘要</div>
            <div id="business-summary"></div>
          </section>
          <section class="section compact">
            <div class="section-title">營運監控</div>
            <div id="ops-monitor"></div>
          </section>
        </aside>
      </div>

      <div class="p5-bottom-grid" aria-label="技能工具模型API">
        <section class="section compact">
          <div class="section-title">常用技能 TOP 5</div>
          <div id="skills-top"></div>
        </section>
        <section class="section compact">
          <div class="section-title">工具狀態</div>
          <div id="tools-status"></div>
        </section>
        <section class="section compact">
          <div class="section-title">模型狀態</div>
          <div id="models-status"></div>
        </section>
        <section class="section compact">
          <div class="section-title">API 狀態</div>
          <div id="apis-status"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="js/shell.js"></script>
  <script>
    (function () {
      CommandCenterShell.loadPageData({
        mockUrl: "mock/p5_swimlane_v1.json",
        liveUrl: "live/p5_swimlane_v1.json",
      })
        .then(function (data) {
          if (!data || data.ok !== true) throw new Error("page data ok!=true");
          CommandCenterShell.renderP5(data);
        })
        .catch(function (err) {
          var banner = document.getElementById("demo-banner");
          if (banner) {
            banner.textContent =
              "資料載入失敗（請以 repo 根目錄 python -m http.server 開啟；預設 mock，live 用 ?source=live）。" +
              String(err && err.message ? err.message : err);
          }
          console.error(err);
        });
    })();
  </script>
</body>
</html>
