research_task:
  description: >
    你必須找出 2026 年台灣市場木地板的真實報價。
    1. 必須包含具體台幣數字：實木地板每坪約多少？超耐磨每坪約多少？
    2. 調查台灣三大品牌（如 Ua Floors, 飛飛, 三木）的官網或論壇評價。
    3. 找出台灣特有的施工費用行情（例如：直舖、平舖、架高的每坪工錢）。
  expected_output: >
    一份包含具體「台幣金額」與「品牌比較」的台灣市場調查報告。

reporting_task:
  description: >
    根據研究資料編寫專業報告。
    【嚴格要求】：
    1. 全文必須使用「台灣繁體中文」，嚴禁出現任何英文段落或單字（名詞請翻譯，如 Engineered Wood 譯為 海島型地板）。
    2. 必須列出具體的「價格對照表」，單位為 台幣/坪。
    3. 針對台灣潮濕氣候，提供具體的施工與防潮建議。
    4. 結尾請用專業的台灣商業書信格式。
  expected_output: >
    一份漂亮的純繁體中文 Markdown 報告，包含詳細報價表與台灣在地裝潢建議。
