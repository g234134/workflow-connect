# Wave-G / P9: WC M2 walkthrough demo fixture execute — CI advisory (non-blocking).
# Runs scripts/run_wc_m2_e2e_walkthrough.py --execute --use-hitl-fixtures for WC-DEMO-1.
# Demo skeleton only: writes artifacts/e2e/WC-DEMO-1/; does NOT modify live *_state.md.
# NOT a required / merge-blocking check.

name: P9 WC M2 fixture execute (advisory)

on:
  schedule:
    # Every two days at 06:00 UTC (advisory regression track)
    - cron: "0 6 */2 * *"
  workflow_dispatch:
    inputs:
      run_unittest:
        description: Also run tests.test_run_wc_m2_e2e_walkthrough (11 tests)
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/p9-wc-m2-fixture-execute.yml"
      - "scripts/run_wc_m2_e2e_walkthrough.py"
      - "tests/test_run_wc_m2_e2e_walkthrough.py"
      - "tests/fixtures/e2e_walkthrough/**"
      - "docs/wave_c/WC_T7_e2e_walkthrough_runbook.md"

concurrency:
  group: p9-wc-m2-fixture-execute-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  p9-wc-m2-fixture-execute:
    name: P9 WC M2 fixture execute (WC-DEMO-1 · advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify WC-DEMO-1 HITL fixtures exist
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_DIR="tests/fixtures/e2e_walkthrough"
          for f in \
            WC-DEMO-1_before_review.md \
            WC-DEMO-1_state_review.md \
            WC-DEMO-1_state_ready_for_order.md
          do
            test -f "${FIXTURE_DIR}/${f}" || { echo "missing fixture: ${FIXTURE_DIR}/${f}"; exit 1; }
          done
          echo "HITL fixtures OK under ${FIXTURE_DIR}/"

      - name: WC M2 demo fixture execute (WC-DEMO-1)
        id: walkthrough
        shell: bash
        run: |
          set -euo pipefail
          START_MS=$(python -c "import time; print(int(time.time()*1000))")
          set +e
          python scripts/run_wc_m2_e2e_walkthrough.py \
            --ticket WC-DEMO-1 \
            --artifacts-root artifacts/e2e \
            --execute \
            --use-hitl-fixtures \
            --json | tee wc_m2_fixture_execute_result.json
          WALKTHROUGH_EXIT=$?
          set -e
          END_MS=$(python -c "import time; print(int(time.time()*1000))")
          export WALKTHROUGH_EXIT START_MS END_MS
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          raw = Path("wc_m2_fixture_execute_result.json").read_text(encoding="utf-8").strip()
          walkthrough = json.loads(raw) if raw else {"ok": False, "message": "empty stdout"}
          summary = {
              "workflow_name": "P9 WC M2 fixture execute (advisory)",
              "job_name": "p9-wc-m2-fixture-execute",
              "trigger": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ticket_id": "WC-DEMO-1",
              "mode": "execute --use-hitl-fixtures",
              "advisory": True,
              "non_blocking": True,
              "demo_only": True,
              "ok": int(os.environ["WALKTHROUGH_EXIT"]) == 0 and walkthrough.get("ok") is True,
              "duration_ms": int(os.environ["END_MS"]) - int(os.environ["START_MS"]),
              "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "github_sha": os.environ.get("GITHUB_SHA", ""),
              "walkthrough_result": walkthrough,
          }
          Path("wc_m2_fixture_execute_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False))
          if not summary["ok"]:
              print("::warning title=P9 WC M2 fixture execute (advisory)::demo fixture execute failed; non-blocking advisory only")
          sys.exit(int(os.environ["WALKTHROUGH_EXIT"]))
          PY

      - name: Walkthrough runner unit tests (11 tests)
        if: >-
          github.event_name != 'workflow_dispatch'
          || inputs.run_unittest
        shell: bash
        run: python -m unittest tests.test_run_wc_m2_e2e_walkthrough -v

      - name: Emit structured failure summary
        if: failure()
        shell: bash
        run: |
          echo "::group::p9-wc-m2-fixture-execute summary"
          cat wc_m2_fixture_execute_summary.json 2>/dev/null || cat wc_m2_fixture_execute_result.json 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload WC M2 fixture execute artifacts (advisory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-wc-m2-fixture-execute-${{ github.run_id }}
          path: |
            wc_m2_fixture_execute_summary.json
            wc_m2_fixture_execute_result.json
            artifacts/e2e/WC-DEMO-1/**
          if-no-files-found: warn
          retention-days: 14
