# P6 (Phase 6): INT regression gate PR optional advisory — Track A (non-blocking).
# Early signal on Wave 6/7/8 assembly regressions; continue-on-error: true — does NOT gate merge.
# blocks_pr_ci: false preserved (governance_decision_p6_int_gate_2026-06-27).
# Design SSOT: docs/ci-design-p6-int-gate-v1.md · Ticket: WF-P6-INT-CI-LANDING

name: P6 INT gate PR optional (advisory)

on:
  push:
    paths:
      - ".github/workflows/p6-int-gate-pr-optional.yml"
      - "04_Workflows/_wave7_regression_gate.py"
      - "04_Workflows/WAVE7_INT_REGRESSION_GATE_v0.1.md"
      - "01_Environments/python_venvs/gov_core_system/**"
      - "docs/phase6-int-regression-gate-contract-v1.md"
      - "routing/toolchain_smoke_matrix_v1.yaml"
  pull_request:
    paths:
      - ".github/workflows/p6-int-gate-pr-optional.yml"
      - "04_Workflows/_wave7_regression_gate.py"
      - "04_Workflows/WAVE7_INT_REGRESSION_GATE_v0.1.md"
      - "01_Environments/python_venvs/gov_core_system/**"
      - "docs/phase6-int-regression-gate-contract-v1.md"
      - "routing/toolchain_smoke_matrix_v1.yaml"
  workflow_dispatch:

concurrency:
  group: p6-int-gate-pr-optional-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  int-tier-a-advisory:
    name: P6 INT Tier-A (advisory · non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gov_core CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          GOV_CORE="01_Environments/python_venvs/gov_core_system"
          pip install -q -r requirements-ci-minimal.txt
          if [[ -f "${GOV_CORE}/requirements.txt" ]]; then
            pip install -q -r "${GOV_CORE}/requirements.txt"
          fi

      - name: INT Tier-A regression (Wave 6/7/8 · advisory)
        id: int_gate
        shell: bash
        run: |
          set -uo pipefail
          OUT_FILE="int_tier_a_advisory.json"
          set +e
          python 04_Workflows/_wave7_regression_gate.py --tier A --pretty | tee "${OUT_FILE}"
          GATE_EXIT=$?
          set -e
          echo "gate_exit=${GATE_EXIT}" >> "${GITHUB_OUTPUT}"
          if [[ "${GATE_EXIT}" -ne 0 ]]; then
            echo "::warning title=P6 INT Tier-A advisory failure::exit ${GATE_EXIT} — non-blocking (continue-on-error: true)"
          fi
          exit "${GATE_EXIT}"

      - name: Upload INT gate advisory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-int-tier-a-advisory-${{ github.run_id }}
          path: int_tier_a_advisory.json
          if-no-files-found: warn
          retention-days: 14
