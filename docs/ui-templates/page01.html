<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全局總覽主頁 · 三省六部指揮中心</title>
  <!-- W4-UI-A：視覺升級對齊 unified_P1.png；權威宿主 = ui/command_center/ -->
  <link rel="stylesheet" href="../../ui/command_center/css/shell.css">
</head>
<body>
  <aside class="sidebar" aria-label="主選單">
    <div class="sidebar-brand">
      <span class="brand-mark">唐</span>
      <span id="brand-title">三省六部指揮中心</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="footer-text" id="operator-label">指揮官 · 系統管理員</div>
      <div class="footer-text">金鑰占位：<span class="mask" id="secret-mask">••••••••</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div>
        <div class="header-title" id="page-title">全局總覽主頁</div>
        <div class="header-sub" id="page-sub">三省六部工作流指揮台</div>
      </div>
      <div class="header-right">
        <div id="tz-label">亞洲 / 台北</div>
        <div id="clock-label">—</div>
      </div>
    </header>

    <div class="banner-demo" id="demo-banner">loading mock… · 權威殼：ui/command_center/p1.html</div>

    <div class="content">
      <div class="kpi-grid" id="kpi-grid" aria-label="KPI"></div>

      <section class="section" aria-label="主流程">
        <div class="section-title">主流程概覽</div>
        <div class="flow-row" id="flow-row"></div>
      </section>

      <div class="grid-2">
        <section class="section" aria-label="六部狀態">
          <div class="section-title">六部狀態</div>
          <div id="dept-status"></div>
        </section>
        <section class="section" aria-label="暗部模組狀態">
          <div class="section-title">暗部模組狀態</div>
          <div id="dark-status"></div>
        </section>
      </div>

      <section class="section" aria-label="P8.9 operator fields">
        <div class="section-title">Operator fields（P8.9 五鍵 · mock）</div>
        <div id="operator-fields"></div>
      </section>

      <section class="section" aria-label="最近活動">
        <div class="section-title">最近活動 <span class="linkish">查看全部活動 ›</span></div>
        <div id="activity-log"></div>
      </section>
    </div>
  </div>

  <script src="../../ui/command_center/js/shell.js"></script>
  <script>
    CommandCenterShell.loadJson("../../ui/command_center/mock/p1_overview_v1.json")
      .then(function (data) {
        if (!data || data.ok !== true) throw new Error("mock ok!=true");
        CommandCenterShell.renderP1(data);
      })
      .catch(function (err) {
        var banner = document.getElementById("demo-banner");
        if (banner) {
          banner.textContent =
            "mock 載入失敗。請自 repo 根目錄：python -m http.server 8765 → /ui/command_center/p1.html · " +
            String(err && err.message ? err.message : err);
        }
      });
  </script>
</body>
</html>
