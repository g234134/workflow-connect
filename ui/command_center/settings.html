<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統設定（薄頁）· 三省六部指揮中心</title>
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <aside class="sidebar" aria-label="主選單">
    <div class="sidebar-brand">
      <span class="brand-mark">唐</span>
      <span id="brand-title">三省六部指揮中心</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="footer-row">
        <span class="avatar" aria-hidden="true">A</span>
        <div>
          <div class="footer-text" id="operator-label">指揮官 · 系統管理員</div>
          <div class="footer-text">金鑰占位：<span class="mask" id="secret-mask">••••••••</span></div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div>
        <div class="header-title"><span id="page-title">系統設定</span></div>
        <div class="header-sub" id="page-sub">薄頁 · 只讀偏好 · ≠ 完整設定頁</div>
      </div>
      <div class="header-right">
        <div id="tz-label">亞洲 / 台北</div>
        <div id="clock-label">—</div>
        <span class="header-avatar" aria-hidden="true">A</span>
      </div>
    </header>

    <div class="banner-demo" id="demo-banner">settings 薄頁 · Wave5 AI sidecar · ≠ live config API · ≠ Round-2</div>

    <div class="content">
      <section class="section" aria-label="display prefs">
        <div class="section-title">顯示與偏好（只讀）</div>
        <div id="prefs-list"></div>
        <p class="skeleton-note">完整可編輯設定／金鑰策略 UI 另票；本頁僅薄補導覽可用資訊。</p>
      </section>

      <section class="section" aria-label="security">
        <div class="section-title">安全摘要</div>
        <div id="security-list"></div>
        <p class="skeleton-note">金鑰遮罩：<span class="mask" id="settings-secret-mask">••••••••</span></p>
      </section>

      <section class="section" aria-label="non claims">
        <div class="section-title">non_claims</div>
        <div id="non-claims-list"></div>
        <p class="skeleton-note">
          五頁入口：
          <a class="linkish" href="p1.html">P1</a> ·
          <a class="linkish" href="p2.html">P2</a> ·
          <a class="linkish" href="p3.html">P3</a> ·
          <a class="linkish" href="p4.html">P4</a> ·
          <a class="linkish" href="p5.html">P5</a> ·
          <a class="linkish" href="settings.html">設定</a>
        </p>
      </section>
    </div>
  </div>

  <script src="js/shell.js"></script>
  <script>
    (function () {
      function fillList(id, items, className) {
        var root = document.getElementById(id);
        if (!root || !items) return;
        root.textContent = "";
        for (var i = 0; i < items.length; i++) {
          var row = document.createElement("div");
          row.className = className || "footer-text";
          row.style.marginBottom = "8px";
          if (typeof items[i] === "string") {
            row.textContent = "· " + items[i];
          } else {
            var label = document.createElement("span");
            label.style.color = "var(--text-muted)";
            label.textContent = items[i].label + "：";
            var value = document.createElement("span");
            value.textContent = items[i].value;
            row.appendChild(label);
            row.appendChild(value);
          }
          root.appendChild(row);
        }
      }

      CommandCenterShell.loadPageData({
        mockUrl: "mock/settings_v1.json",
        liveUrl: "mock/settings_v1.json",
      })
        .then(function (data) {
          CommandCenterShell.renderNavOnly(data);
          fillList("prefs-list", data.prefs || []);
          fillList("security-list", data.security_notes || []);
          fillList("non-claims-list", data.non_claims || []);
          var mask = document.getElementById("settings-secret-mask");
          if (mask && data.secrets && data.secrets.api_key_display) {
            mask.textContent = data.secrets.api_key_display;
          }
        })
        .catch(function (err) {
          var banner = document.getElementById("demo-banner");
          if (banner) banner.textContent = "settings 薄頁載入失敗 · " + String(err);
        });
    })();
  </script>
</body>
</html>
