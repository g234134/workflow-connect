<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗部執行與交付閉環 · 三省六部指揮中心</title>
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <aside class="sidebar" aria-label="主選單">
    <div class="sidebar-brand">
      <span class="brand-mark">唐</span>
      <span id="brand-title">三省六部指揮中心</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="footer-row">
        <span class="avatar" aria-hidden="true">A</span>
        <div>
          <div class="footer-text" id="operator-label">指揮官 · 系統管理員</div>
          <div class="footer-text">金鑰占位：<span class="mask" id="secret-mask">••••••••</span></div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div>
        <div class="header-title">
          <span id="page-title">暗部執行與交付閉環</span>
          <span class="p3-sys-badge" id="p3-sys-badge">● 系統運行中</span>
        </div>
        <div class="header-sub" id="page-sub">統一指揮 · 協同作戰 · 高效治理（mock · 只讀）</div>
      </div>
      <div class="header-right">
        <div id="tz-label">亞洲 / 台北</div>
        <div id="clock-label">—</div>
        <span class="header-avatar" aria-hidden="true">A</span>
      </div>
    </header>

    <div class="banner-demo" id="demo-banner">loading mock…</div>

    <div class="content p3-content">
      <div class="p3-main-grid">
        <div class="p3-main-col">
          <section class="section" aria-label="暗部執行層模組面板">
            <div class="section-title">暗部執行層模組面板</div>
            <div class="p3-module-grid" id="p3-modules"></div>
          </section>

          <section class="section" aria-label="流程閉環視圖">
            <div class="section-title" id="p3-loop-title">流程閉環視圖</div>
            <div class="p3-loop-row" id="p3-loop-stages"></div>
            <div class="p3-backflow" id="p3-backflow" aria-hidden="true"></div>
          </section>
        </div>

        <aside class="p3-side" aria-label="即時監控">
          <div class="section-title" id="p3-monitor-title">即時監控</div>
          <div id="p3-side-cards"></div>
        </aside>
      </div>

      <div class="p3-footer-strip" id="p3-footer-strip" aria-label="全域摘要"></div>

      <section class="section compact p3-op-section" aria-label="operator fields">
        <div class="section-title">P8.9 operator_fields（sidecar · read_only）</div>
        <div id="operator-fields"></div>
      </section>
    </div>
  </div>

  <script src="js/shell.js"></script>
  <script>
    (function () {
      CommandCenterShell.loadPageData({
        mockUrl: "mock/p3_dark_loop_v1.json",
        liveUrl: "live/p3_dark_loop_v1.json",
      })
        .then(function (data) {
          if (!data || data.ok !== true) throw new Error("page data ok!=true");
          CommandCenterShell.renderP3(data);
        })
        .catch(function (err) {
          var banner = document.getElementById("demo-banner");
          if (banner) {
            banner.textContent =
              "資料載入失敗（請以 repo 根目錄 python -m http.server 開啟；預設 mock，live 用 ?source=live）。" +
              String(err && err.message ? err.message : err);
          }
          console.error(err);
        });
    })();
  </script>
</body>
</html>
