version: '3.8'

networks:
  open-webui-network:
    driver: bridge

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_SECRET_KEY=your-secret-key-change-this
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - open-webui-network
    restart: unless-stopped

  ttyd:
    image: tsl0922/ttyd
    container_name: ttyd
    ports:
      - "7681:7681"
    volumes:
      - open-webui-data:/data
    command: ttyd -p 7681 bash
    networks:
      - open-webui-network
    restart: unless-stopped

volumes:
  open-webui-data:
