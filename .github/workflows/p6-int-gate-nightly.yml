# P6 (Phase 6): INT regression gate nightly — Track B (mandatory per governance_decision_p6_int_gate_2026-06-27).
# Runs Wave 6/7/8 Tier-A assembly regression via _wave7_regression_gate.py.
# Does NOT block PR merge. Scheduled UTC 07:00 (after eval-gate shadow nightly 06:00).
# Design SSOT: docs/ci-design-p6-int-gate-v1.md · Ticket: WF-P6-INT-CI-LANDING

name: P6 INT gate nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: INT tier (A, B, ALL)
        type: choice
        options:
          - A
          - B
          - ALL
        default: A

concurrency:
  group: p6-int-gate-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  int-regression-nightly:
    name: INT Tier-A nightly (Track B)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Source-only gov_core tree (Scripts/Lib remain gitignored). CLI also inserts this path.
      PYTHONPATH: ${{ github.workspace }}/01_Environments/python_venvs/gov_core_system:${{ github.workspace }}
      TANG_GOV_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize gov_core source (CI mirror → Master_Map path)
        shell: bash
        run: |
          set -euo pipefail
          MIRROR="ci/gov_core_system"
          GOV_CORE="01_Environments/python_venvs/gov_core_system"
          test -d "${MIRROR}/core" || {
            echo "::error title=P6 INT infra::missing CI mirror ${MIRROR}/core"
            exit 2
          }
          mkdir -p "$(dirname "${GOV_CORE}")"
          rm -rf "${GOV_CORE}"
          cp -a "${MIRROR}" "${GOV_CORE}"
          echo "materialized ${GOV_CORE} from ${MIRROR}"

      - name: Verify gov_core source visibility
        shell: bash
        run: |
          set -euo pipefail
          GOV_CORE="01_Environments/python_venvs/gov_core_system"
          test -d "${GOV_CORE}/core" || {
            echo "::error title=P6 INT infra::missing ${GOV_CORE}/core on checkout (source must be landed; venv tree stays gitignored)"
            exit 2
          }
          test -f "${GOV_CORE}/core/wave7_regression_gate.py" || {
            echo "::error title=P6 INT infra::missing core.wave7_regression_gate on checkout"
            exit 2
          }
          python - <<'PY'
          import sys
          from pathlib import Path
          gov = Path("01_Environments/python_venvs/gov_core_system").resolve()
          sys.path.insert(0, str(gov))
          import core.wave7_regression_gate as g
          print("core_ok", getattr(g, "__file__", "?"))
          PY

      - name: Install gov_core CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          GOV_CORE="01_Environments/python_venvs/gov_core_system"
          pip install -q -r requirements-ci-minimal.txt
          if [[ -f "${GOV_CORE}/requirements.txt" ]]; then
            pip install -q -r "${GOV_CORE}/requirements.txt"
          fi

      - name: Wave 6/7/8 INT regression (Tier-A)
        id: int_gate
        shell: bash
        run: |
          set -euo pipefail
          TIER="${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'A' }}"
          OUT_DIR="artifacts/p6-int-gate"
          OUT_FILE="${OUT_DIR}/nightly.json"
          mkdir -p "${OUT_DIR}"
          set +e
          python 04_Workflows/_wave7_regression_gate.py --tier "${TIER}" --pretty | tee "${OUT_FILE}"
          GATE_EXIT=$?
          set -e
          echo "gate_exit=${GATE_EXIT}" >> "${GITHUB_OUTPUT}"
          echo "gate_tier=${TIER}" >> "${GITHUB_OUTPUT}"
          if [[ "${GATE_EXIT}" -eq 2 ]]; then
            echo "::error title=INT gate infrastructure failure::exit code 2 — venv/map bootstrap (contract §2.3)"
          fi
          exit "${GATE_EXIT}"

      - name: Upload INT gate nightly artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-int-gate-nightly-${{ github.run_id }}
          path: artifacts/p6-int-gate/nightly.json
          if-no-files-found: warn
          retention-days: 30
